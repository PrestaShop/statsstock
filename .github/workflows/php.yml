---
name: PHP tests
on: [push, pull_request]
jobs:
  # Check there is no syntax errors in the project
  php-linter:
    name: PHP Syntax check 5.6 => 8.4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: PHP syntax checker 5.6
        uses: prestashop/github-action-php-lint/5.6@master

      - name: PHP syntax checker 7.2
        uses: prestashop/github-action-php-lint/7.2@master

      - name: PHP syntax checker 7.3
        uses: prestashop/github-action-php-lint/7.3@master

      - name: PHP syntax checker 7.4
        uses: prestashop/github-action-php-lint/7.4@master

      - name: PHP syntax checker 8.0
        uses: prestashop/github-action-php-lint/8.0@master

      - name: PHP syntax checker 8.1
        uses: prestashop/github-action-php-lint/8.1@master

      - name: PHP syntax checker 8.2
        uses: prestashop/github-action-php-lint/8.2@master

      - name: PHP syntax checker 8.3
        uses: prestashop/github-action-php-lint/8.3@master

      - name: PHP syntax checker 8.4
        uses: prestashop/github-action-php-lint/8.4@master

  # Check the PHP code follow the coding standards
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: composer install

      - name: Run PHP-CS-Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --using-cache=no --diff-format udiff

  # Run PHPStan against the module and a PrestaShop release
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run older version jobs with PHP 7.4
          - presta-versions: '1.7.1.2'
            php-version: '7.4'
          - presta-versions: '1.7.2.5'
            php-version: '7.4'
          - presta-versions: '1.7.3.4'
            php-version: '7.4'
          - presta-versions: '1.7.4.4'
            php-version: '7.4'
          - presta-versions: '1.7.5.1'
            php-version: '7.4'
          - presta-versions: '1.7.6'
            php-version: '7.4'
          - presta-versions: '1.7.7'
            php-version: '7.4'
          - presta-versions: '1.7.8'
            php-version: '7.4'

          # Newer ones with PHP 8.1
          - presta-versions: 'latest'
            php-version: '8.1'

    steps:
      # Setup PHP environment based on matrix
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      # Checkout module source code
      - name: Checkout
        uses: actions/checkout@v5

      # Install Composer dependencies
      - run: composer install

      # Run PHPStan analysis for the selected PrestaShop version
      - name: Execute PHPStan on PrestaShop (Tag ${{ matrix.presta-versions }})
        run: ./tests/phpstan.sh ${{ matrix.presta-versions }}
